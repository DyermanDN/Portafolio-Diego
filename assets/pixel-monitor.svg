  <!-- Screen -->
  <rect x="7" y="7" width="18" height="12" fill="#1a1a1a"/>
  <!-- Screen content -->
  <rect x="8" y="8" width="6" height="2" fill="#4caf50"/>
  <rect x="8" y="11" width="10" height="1" fill="#3d7a35"/>
  <rect x="8" y="13" width="8" height="1" fill="#3d7a35"/>
  <!-- Stand neck -->
